name: Node CI

on: [push]

jobs:
  test:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Projeto-2-test+node

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Executar testes
        run: npm test